name: Remove stale Home world-closing import

on:
  push:
    branches: [Aw.5]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.head_commit.message != 'Remove stale Home world-closing import' && github.event.head_commit.message != 'Remove temporary world-closing cleanup workflow' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove only the stale style import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('style.css')
          s = p.read_text(encoding='utf-8')
          old = '@import url("world-closing.css");\n'
          if old not in s:
              raise SystemExit('Expected stale world-closing import not found; stopping.')
          s = s.replace(old, '', 1)
          p.write_text(s, encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','style.css'], check=True)
          subprocess.run(['git','commit','-m','Remove stale Home world-closing import'], check=True)
          subprocess.run(['git','push','origin','HEAD:Aw.5'], check=True)
          PY
