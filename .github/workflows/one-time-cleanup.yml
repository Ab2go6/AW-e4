name: One-time visual cleanup

on:
  push:
    branches: [Aw.5]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.head_commit.message != 'Clean retired visual layers' && github.event.head_commit.message != 'Remove temporary cleanup workflow' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove retired visual layers without touching active design
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path('.')

          # 1) araouaa-visual-lock.css: keep Product/Footer/World rules,
          #    but remove all obsolete Home hero ownership.
          p = root / 'araouaa-visual-lock.css'
          s = p.read_text(encoding='utf-8')

          old_product_block = '''/* Home + Product hero: exact approved cream field and wave lines. */
          body:not(.world-page) .hero,
          .products-page .products-hero{position:relative!important;overflow:hidden!important;isolation:isolate!important;background:var(--ara-cream)!important;background-image:none!important}
          body:not(.world-page) .hero::before,
          .products-page .products-hero::before{content:""!important;position:absolute!important;inset:0!important;z-index:0!important;pointer-events:none!important;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 1200 800' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 400 Q200 250 400 380 T800 350 T1200 420' fill='none' stroke='%23E8D9B5' stroke-width='55' stroke-opacity='.55'/%3E%3Cpath d='M0 480 Q250 320 500 460 T1000 430 T1200 500' fill='none' stroke='%23E0CFA3' stroke-width='45' stroke-opacity='.45'/%3E%3Cpath d='M0 320 Q300 180 600 310 T1200 290' fill='none' stroke='%23F0E4C9' stroke-width='40' stroke-opacity='.4'/%3E%3Cpath d='M0 550 Q350 400 700 530 T1200 560' fill='none' stroke='%23D9C48F' stroke-width='35' stroke-opacity='.35'/%3E%3C/svg%3E")!important;background-size:cover!important;background-repeat:no-repeat!important;background-position:center!important;opacity:.9!important}
          body:not(.world-page) .hero::after{content:none!important;display:none!important}
          body:not(.world-page) .hero-backdrop{display:none!important}
          body:not(.world-page) .hero-inner,.products-page .products-hero-inner{position:relative!important;z-index:2!important}
          '''
          new_product_block = '''/* Product hero: exact approved cream field and wave lines. */
          .products-page .products-hero{position:relative!important;overflow:hidden!important;isolation:isolate!important;background:var(--ara-cream)!important;background-image:none!important}
          .products-page .products-hero::before{content:""!important;position:absolute!important;inset:0!important;z-index:0!important;pointer-events:none!important;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 1200 800' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 400 Q200 250 400 380 T800 350 T1200 420' fill='none' stroke='%23E8D9B5' stroke-width='55' stroke-opacity='.55'/%3E%3Cpath d='M0 480 Q250 320 500 460 T1000 430 T1200 500' fill='none' stroke='%23E0CFA3' stroke-width='45' stroke-opacity='.45'/%3E%3Cpath d='M0 320 Q300 180 600 310 T1200 290' fill='none' stroke='%23F0E4C9' stroke-width='40' stroke-opacity='.4'/%3E%3Cpath d='M0 550 Q350 400 700 530 T1200 560' fill='none' stroke='%23D9C48F' stroke-width='35' stroke-opacity='.35'/%3E%3C/svg%3E")!important;background-size:cover!important;background-repeat:no-repeat!important;background-position:center!important;opacity:.9!important}
          .products-page .products-hero-inner{position:relative!important;z-index:2!important}
          '''
          if old_product_block not in s:
              raise SystemExit('Expected visual-lock Home/Product block not found; stopping.')
          s = s.replace(old_product_block, new_product_block, 1)
          s, n = re.subn(r'\n/\* Home hero test:.*?\n\n(?=/\* Product hierarchy rail)', '\n\n', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Expected visual-lock Home test block not found; stopping.')
          p.write_text(s, encoding='utf-8')

          # 2) araouaa-light-engine.css: remove only the obsolete Home hero paint.
          p = root / 'araouaa-light-engine.css'
          s = p.read_text(encoding='utf-8')
          old = '''body:not(.world-page) .hero{
            background:
              radial-gradient(circle at 76% 30%,rgba(223,189,122,.16),transparent 23%),
              radial-gradient(circle at 14% 78%,rgba(82,107,89,.10),transparent 29%),
              linear-gradient(120deg,var(--ara-paper-3) 0%,var(--ara-paper-2) 46%,#ddd0bc 100%);
          }
          body:not(.world-page) .hero::before{
            content:"";
            position:absolute;
            inset:0;
            pointer-events:none;
            background:linear-gradient(112deg,rgba(255,255,255,.26),transparent 31%,transparent 68%,rgba(38,59,50,.08));
            mix-blend-mode:soft-light;
          }
          body:not(.world-page) .hero-backdrop{
            filter:saturate(.96) contrast(1.035) brightness(.985);
          }
          '''
          new = '''body:not(.world-page) .hero-backdrop{
            filter:saturate(.96) contrast(1.035) brightness(.985);
          }
          '''
          if old not in s:
              raise SystemExit('Expected light-engine Home hero paint not found; stopping.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 3) Remove dead runtime cleanup and refresh cache key only.
          p = root / 'araouaa-motion.js'
          s = p.read_text(encoding='utf-8')
          s = s.replace("const VERSION = '20260917i';", "const VERSION = '20260917j';", 1)
          s, n = re.subn(r'\n  const cleanupLegacyVisualStyles = \(\) => \{.*?\n  \};\n', '\n', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Expected dead runtime cleanup function not found; stopping.')
          s = s.replace('\n  cleanupLegacyVisualStyles();\n  loadStyles();', '\n  loadStyles();', 1)
          s = s.replace('    cleanupLegacyVisualStyles();\n', '', 1)
          p.write_text(s, encoding='utf-8')

          p = root / 'script.js'
          s = p.read_text(encoding='utf-8')
          if "const VERSION = '20260917i';" not in s:
              raise SystemExit('Expected script.js cache key not found; stopping.')
          s = s.replace("const VERSION = '20260917i';", "const VERSION = '20260917j';", 1)
          p.write_text(s, encoding='utf-8')

          # 4) Remove only obsolete CSS imports/links from the active files.
          p = root / 'footer.css'
          s = p.read_text(encoding='utf-8')
          s = s.replace('@import url("journal-section-theme.css");\n', '', 1)
          p.write_text(s, encoding='utf-8')

          for name in ['origine.html','collections.html','journal.html','savoir-faire.html','atelier.html']:
              p = root / name
              s = p.read_text(encoding='utf-8')
              s2 = s.replace('<link rel="stylesheet" href="world-cinema.css">', '')
              if name == 'journal.html':
                  s2 = s2.replace('<link rel="stylesheet" href="journal-quote.css">', '')
              p.write_text(s2, encoding='utf-8')

          # 5) Delete files that are confirmed obsolete/orphaned.
          for name in [
              'araouaa-final-visual-sync.css',
              'world-hero-contrast.css',
              'world-cinema.css',
              'journal-section-theme.css',
              'journal-quote.css',
              'world-language.js',
          ]:
              p = root / name
              if p.exists():
                  p.unlink()

          # 6) Commit only this cleanup.
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','-A'], check=True)
          subprocess.run(['git','commit','-m','Clean retired visual layers'], check=True)
          subprocess.run(['git','push','origin','HEAD:Aw.5'], check=True)
          PY
