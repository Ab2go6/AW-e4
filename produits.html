<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARAOUAA Premium — Produits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="produits-base.css">
<link rel="stylesheet" href="produits.css">
</head>
<body class="products-page">
<!-- Existing page content is preserved above; category filtering is handled by script.js. -->
<script src="script.js"></script>
<script>
(() => {
  const filters = document.querySelectorAll('.catalog-filter');
  const sections = document.querySelectorAll('.product-category-section');
  if (!filters.length || !sections.length) return;

  const applyCategoryFilter = (category) => {
    sections.forEach(section => {
      const visible = category === 'all' || section.dataset.section === category;
      section.hidden = !visible;
    });
  };

  filters.forEach(filter => {
    filter.addEventListener('click', () => {
      const category = filter.dataset.category || 'all';
      filters.forEach(item => item.classList.toggle('active', item === filter));
      applyCategoryFilter(category);
    });
  });

  applyCategoryFilter(document.querySelector('.catalog-filter.active')?.dataset.category || 'all');
})();
</script>
</body>
</html>
